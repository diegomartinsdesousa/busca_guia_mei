services:
  - type: web
    name: busca-guia-mei
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: INFOSIMPLES_TOKEN
        sync: false
      - key: DOWNLOAD_DIR
        value: /tmp/downloads

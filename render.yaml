services:
  - type: web
    name: busca-guia-mei
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: INFOSIMPLES_TOKEN
        sync: false
      - key: DOWNLOAD_DIR
        value: /tmp/downloads
      - key: DELAY_ENTRE_PERIODOS_MS
        value: "12000"
      - key: INFOSIMPLES_MAX_RETRIES_609
        value: "2"
      - key: INFOSIMPLES_RETRY_DELAY_609_MS
        value: "30000"
